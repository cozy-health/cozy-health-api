name: Verify Push Limits on MySQL

on:
  push:
    branches: [develop, 'verify/**']
    paths:
      - 'tests/Concurrency/**'
      - 'app/Jobs/SendPushAttempt.php'
      - 'app/Services/Push/**'
      - '.github/workflows/push-mysql-concurrency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: isolated-root-fixture
          MYSQL_DATABASE: cozy_push_concurrency_test
          MYSQL_USER: cozy_push_test
          MYSQL_PASSWORD: isolated-user-fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: cozy_push_concurrency_test
      DB_USERNAME: cozy_push_test
      DB_PASSWORD: isolated-user-fixture
      DB_URL: ''
      DB_REQUIRE_TLS: 'false'
      DB_TLS_ENFORCE: 'false'
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      CACHE_PREFIX: push-concurrency-fixture-
      MAIL_MAILER: log
      BCRYPT_ROUNDS: '4'
      PUSH_ENABLED: 'false'
      PUSH_IOS_ENABLED: 'false'
      PUSH_TEST_ROUNDS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, dom, curl, zip
          coverage: none
      - name: Install isolated test dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist
          task_key="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          echo "::add-mask::$task_key"
          echo "APP_KEY=$task_key" >> "$GITHUB_ENV"
      - name: Verify limits with simultaneous schedulers and database queue workers
        run: php tests/Concurrency/mysql_push.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: push-mysql-verification-${{ github.sha }}-${{ github.run_id }}
          path: storage/framework/testing/push-mysql-results.json
          if-no-files-found: warn
          retention-days: 30
