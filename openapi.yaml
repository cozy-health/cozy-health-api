{
  "openapi": "3.1.0",
  "info": {
    "title": "Cozy Health API",
    "version": "1.0.0",
    "description": "API matching the current Cozy Health Flutter client."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8000"
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Sanctum"
      },
      "providerAuth": {
        "type": "http",
        "scheme": "bearer",
        "description": "Provider-scoped access token; patient/admin credentials do not authorize provider APIs."
      },
      "adminAuth": {
        "type": "http",
        "scheme": "bearer",
        "description": "Expiring admin-scoped token; operation middleware and assigned reviewer capabilities still apply."
      }
    },
    "schemas": {
      "AgeDeclaration": {
        "type": "object",
        "required": [
          "date_of_birth",
          "residence_country"
        ],
        "properties": {
          "date_of_birth": {
            "type": "string",
            "format": "date"
          },
          "residence_country": {
            "type": "string",
            "pattern": "^[A-Z]{2}$",
            "description": "ISO 3166-1 country of residence, checked against the supported code list."
          }
        }
      },
      "GuardianInvitation": {
        "type": "object",
        "required": [
          "guardian_name",
          "guardian_email",
          "relationship"
        ],
        "properties": {
          "guardian_name": {
            "type": "string",
            "maxLength": 120
          },
          "guardian_email": {
            "type": "string",
            "format": "email",
            "maxLength": 190
          },
          "relationship": {
            "type": "string",
            "enum": [
              "parent",
              "legal_guardian"
            ]
          }
        }
      },
      "AgeEligibility": {
        "type": "object",
        "required": [
          "owner_id",
          "enforced",
          "allowed",
          "reason",
          "age_band",
          "online_required"
        ],
        "properties": {
          "owner_id": {
            "type": "integer"
          },
          "enforced": {
            "type": "boolean",
            "const": false
          },
          "allowed": {
            "type": "boolean",
            "const": true
          },
          "reason": {
            "type": [
              "string",
              "null"
            ]
          },
          "age_band": {
            "type": "string",
            "const": "unknown"
          },
          "online_required": {
            "type": "boolean"
          },
          "invitations_enabled": {
            "type": "boolean"
          },
          "retired": {
            "type": "boolean",
            "const": true
          }
        },
        "description": "Legacy compatibility response. Does not certify age or replace document consent."
      },
      "AdminArticleDraft": {
        "type": "object",
        "required": [
          "title",
          "slug",
          "category",
          "excerpt",
          "body",
          "read_time_minutes"
        ],
        "properties": {
          "title": {
            "type": "string",
            "maxLength": 255
          },
          "slug": {
            "type": "string",
            "maxLength": 100,
            "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          },
          "category": {
            "type": "string",
            "enum": [
              "anxiety",
              "depression",
              "sleep",
              "relationships",
              "self-care",
              "work"
            ]
          },
          "excerpt": {
            "type": "string",
            "maxLength": 1000
          },
          "body": {
            "type": "string",
            "maxLength": 50000,
            "description": "Plain text, displayed without HTML interpretation."
          },
          "read_time_minutes": {
            "type": "integer",
            "minimum": 1,
            "maximum": 180
          },
          "license": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 255,
            "description": "Required and nonempty before publication."
          },
          "source_url": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 1000,
            "pattern": "^https://"
          }
        }
      },
      "AdminArticleVersion": {
        "type": "object",
        "required": [
          "expected_version"
        ],
        "properties": {
          "expected_version": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        }
      },
      "JournalSharePreview": {
        "type": "object",
        "required": [
          "journal_id",
          "revision",
          "provider",
          "entry",
          "later_edits_shared"
        ],
        "properties": {
          "journal_id": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "provider": {
            "type": "object",
            "required": [
              "id",
              "name"
            ],
            "properties": {
              "id": {
                "type": "integer"
              },
              "name": {
                "type": "string"
              }
            }
          },
          "entry": {
            "$ref": "#/components/schemas/JournalSharedEntry"
          },
          "later_edits_shared": {
            "const": false
          }
        }
      },
      "JournalShareRequest": {
        "type": "object",
        "required": [
          "journal_id",
          "expected_revision",
          "client_id",
          "confirmed"
        ],
        "properties": {
          "journal_id": {
            "type": "string",
            "format": "uuid"
          },
          "expected_revision": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "client_id": {
            "type": "string",
            "format": "uuid"
          },
          "confirmed": {
            "type": "boolean",
            "const": true
          }
        }
      },
      "JournalSharedCopy": {
        "type": "object",
        "required": [
          "share_id",
          "entry",
          "shared_at",
          "later_edits_shared"
        ],
        "properties": {
          "share_id": {
            "type": "string",
            "format": "uuid"
          },
          "entry": {
            "$ref": "#/components/schemas/JournalSharedEntry"
          },
          "shared_at": {
            "type": "string",
            "format": "date-time"
          },
          "later_edits_shared": {
            "const": false
          }
        }
      },
      "JournalShareResult": {
        "type": "object",
        "required": [
          "share_id",
          "replayed"
        ],
        "properties": {
          "share_id": {
            "type": "string",
            "format": "uuid"
          },
          "replayed": {
            "type": "boolean"
          }
        }
      },
      "SyncOperation": {
        "type": "object",
        "required": [
          "type",
          "action"
        ],
        "properties": {
          "client_operation_id": {
            "type": "string"
          },
          "type": {
            "type": "string"
          },
          "action": {
            "type": "string",
            "enum": [
              "upsert",
              "delete"
            ]
          },
          "id": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "description": "Provide the record id in data.id or id. Unsupported/invalid operations return a matched failure without rolling back valid operations. Subscription writes are denied. Assistant writes return gone. Notifications can only update read state on an existing owned record, or delete it."
      },
      "SyncResult": {
        "type": "object",
        "required": [
          "success"
        ],
        "properties": {
          "client_operation_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "client_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "type": {
            "type": [
              "string",
              "null"
            ]
          },
          "id": {
            "type": [
              "string",
              "null"
            ]
          },
          "success": {
            "type": "boolean"
          },
          "error": {
            "type": "string"
          },
          "error_code": {
            "type": "string"
          },
          "errors": {
            "type": "object",
            "additionalProperties": {
              "type": "array",
              "items": {
                "type": "string"
              }
            }
          }
        }
      },
      "MoodWrite": {
        "type": "object",
        "required": [
          "id",
          "mood",
          "intensity"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "mood": {
            "type": "string",
            "maxLength": 20
          },
          "intensity": {
            "type": "integer",
            "minimum": 0,
            "maximum": 10
          },
          "note": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 100000
          },
          "sleep_quality": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "maximum": 10
          },
          "energy_level": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "maximum": 10
          },
          "expression_slug": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 100
          },
          "custom_trigger": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 255
          },
          "coping_helped": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 20
          },
          "is_crisis_flagged": {
            "type": "boolean"
          },
          "is_deleted": {
            "type": "boolean"
          },
          "client_created_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "client_updated_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "triggers": {
            "type": [
              "array",
              "null"
            ],
            "items": {
              "type": "string",
              "maxLength": 255
            }
          },
          "body_sensations": {
            "type": [
              "array",
              "null"
            ],
            "items": {
              "type": "string",
              "maxLength": 255
            }
          },
          "coping_strategies": {
            "type": [
              "array",
              "null"
            ],
            "items": {
              "type": "string",
              "maxLength": 255
            }
          }
        }
      },
      "SafetyPlanWrite": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "maxLength": 100
          },
          "is_complete": {
            "type": "boolean"
          },
          "is_deleted": {
            "type": "boolean"
          },
          "last_updated_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "client_updated_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "warning_signs": {
            "type": [
              "array",
              "null"
            ],
            "maxItems": 100,
            "items": {
              "type": "string",
              "maxLength": 1000
            }
          },
          "coping_strategies": {
            "type": [
              "array",
              "null"
            ],
            "maxItems": 100,
            "items": {
              "type": "string",
              "maxLength": 1000
            }
          },
          "distractions": {
            "type": [
              "array",
              "null"
            ],
            "maxItems": 100,
            "items": {
              "type": "string",
              "maxLength": 1000
            }
          },
          "environment_steps": {
            "type": [
              "array",
              "null"
            ],
            "maxItems": 100,
            "items": {
              "type": "string",
              "maxLength": 1000
            }
          },
          "people": {
            "type": [
              "array",
              "null"
            ],
            "maxItems": 100,
            "items": {
              "type": "object",
              "maxProperties": 10,
              "additionalProperties": {
                "type": "string",
                "maxLength": 1000
              }
            }
          },
          "professionals": {
            "type": [
              "array",
              "null"
            ],
            "maxItems": 100,
            "items": {
              "type": "object",
              "maxProperties": 10,
              "additionalProperties": {
                "type": "string",
                "maxLength": 1000
              }
            }
          }
        }
      },
      "SignInChallenge": {
        "type": "object",
        "required": [
          "challenge_required",
          "challenge_token",
          "method",
          "expires_at"
        ],
        "properties": {
          "challenge_required": {
            "const": true
          },
          "challenge_token": {
            "type": "string",
            "minLength": 64,
            "maxLength": 64,
            "readOnly": true
          },
          "method": {
            "type": "string",
            "enum": [
              "email",
              "questions"
            ]
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "email_delivery": {
            "type": [
              "string",
              "null"
            ],
            "enum": [
              "queued",
              "failed",
              "unavailable",
              null
            ]
          },
          "questions": {
            "type": "array",
            "maxItems": 2,
            "items": {
              "type": "object",
              "required": [
                "id",
                "prompt"
              ],
              "properties": {
                "id": {
                  "type": "string"
                },
                "prompt": {
                  "type": "string"
                }
              }
            }
          },
          "support_email": {
            "type": "string",
            "format": "email"
          }
        },
        "description": "A provisional challenge, never an authenticated session. Store its opaque token only for verification/resend; never in URLs or analytics."
      },
      "SignInVerification": {
        "type": "object",
        "required": [
          "challenge_token"
        ],
        "properties": {
          "challenge_token": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "code": {
            "type": "string",
            "minLength": 6,
            "maxLength": 6
          },
          "answers": {
            "type": "object",
            "maxProperties": 2,
            "additionalProperties": {
              "type": "string",
              "maxLength": 200
            }
          }
        },
        "description": "Supply the email code or the two challenged answers. Verification consumes the challenge once."
      },
      "SignInPreferencesWrite": {
        "type": "object",
        "required": [
          "method",
          "security_settings_token"
        ],
        "properties": {
          "method": {
            "type": "string",
            "enum": [
              "email",
              "questions"
            ]
          },
          "security_settings_token": {
            "type": "string",
            "minLength": 64,
            "maxLength": 64,
            "writeOnly": true
          },
          "questions": {
            "type": "array",
            "minItems": 3,
            "maxItems": 3,
            "items": {
              "type": "object",
              "required": [
                "id",
                "answer"
              ],
              "properties": {
                "id": {
                  "type": "string"
                },
                "answer": {
                  "type": "string",
                  "minLength": 3,
                  "maxLength": 200,
                  "writeOnly": true
                }
              }
            }
          }
        },
        "description": "Questions requires three distinct catalog IDs. A recently verified, email-bound, single-use settings ticket is mandatory for either method."
      },
      "StreakProgress": {
        "type": "object",
        "required": [
          "account_id",
          "accounting_version",
          "earning_starts",
          "as_of",
          "local_date",
          "timezone",
          "current_days",
          "best_days",
          "rest_days",
          "earning_progress",
          "completed_dates",
          "protected_dates",
          "credited_sources"
        ],
        "properties": {
          "account_id": {
            "type": "string"
          },
          "accounting_version": {
            "type": "integer",
            "const": 1
          },
          "earning_starts": {
            "type": "string",
            "format": "date"
          },
          "as_of": {
            "type": "string",
            "format": "date-time"
          },
          "local_date": {
            "type": "string",
            "format": "date"
          },
          "timezone": {
            "type": "string"
          },
          "current_days": {
            "type": "integer",
            "minimum": 0
          },
          "best_days": {
            "type": "integer",
            "minimum": 0
          },
          "rest_days": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2
          },
          "earning_progress": {
            "type": "integer",
            "minimum": 0,
            "maximum": 6
          },
          "completed_dates": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "date"
            }
          },
          "protected_dates": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "date"
            }
          },
          "credited_sources": {
            "type": "object",
            "additionalProperties": {
              "type": "string",
              "format": "date"
            },
            "description": "Owned mood source UUID to its immutable original credited calendar date. No mood contents."
          }
        }
      },
      "ApiValidationError": {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          },
          "errors": {
            "type": "object",
            "additionalProperties": {
              "type": "array",
              "items": {
                "type": "string"
              }
            }
          }
        }
      },
      "SessionPair": {
        "type": "object",
        "required": [
          "token",
          "refresh_token",
          "expires_at",
          "refresh_expires_at"
        ],
        "properties": {
          "token": {
            "type": "string",
            "description": "Role-scoped bearer credential. Keep in secure storage; never log."
          },
          "refresh_token": {
            "type": "string",
            "minLength": 64,
            "maxLength": 64,
            "description": "Single-use rotating refresh credential."
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "refresh_expires_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "PendingSignInChallenge": {
        "type": "object",
        "required": [
          "challenge_required",
          "challenge_token",
          "method",
          "expires_at"
        ],
        "properties": {
          "challenge_required": {
            "const": true
          },
          "challenge_token": {
            "type": "string"
          },
          "method": {
            "type": "string",
            "enum": [
              "email",
              "questions"
            ]
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "questions": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "email_delivery": {
            "type": "string"
          }
        },
        "description": "Pending proof does not grant private access. No access or refresh credential is issued in this response."
      },
      "JournalSharedEntry": {
        "oneOf": [
          {
            "type": "object",
            "required": [
              "title",
              "body"
            ],
            "properties": {
              "kind": {
                "type": "string",
                "enum": [
                  "written"
                ]
              },
              "title": {
                "type": "string"
              },
              "body": {
                "type": "string"
              }
            }
          },
          {
            "type": "object",
            "required": [
              "kind",
              "title",
              "body",
              "audio"
            ],
            "properties": {
              "kind": {
                "const": "voice"
              },
              "title": {
                "type": "string"
              },
              "body": {
                "type": "string",
                "const": ""
              },
              "audio": {
                "type": "object",
                "required": [
                  "id",
                  "duration",
                  "media_type"
                ],
                "properties": {
                  "id": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "duration": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 300
                  },
                  "media_type": {
                    "type": "string",
                    "const": "audio/mp4"
                  }
                }
              }
            }
          }
        ]
      }
    }
  },
