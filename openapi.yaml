        "description": "Action errors include guardian_unavailable, guardian_delivery_failed, guardian_email_unverified, guardian_email_matches, guardian_not_applicable and age_case_open. Invitation throttling returns code=guardian_rate_limited, retry_after seconds and Retry-After header. Validation errors retain their field keys."
