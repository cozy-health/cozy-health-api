{
  "openapi": "3.1.0",
  "info": {
    "title": "Cozy Health API",
    "version": "1.0.0",
    "description": "API matching the current Cozy Health Flutter client."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8000"
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Sanctum"
      }
    },
    "schemas": {
      "AgeDeclaration": {
        "type": "object",
        "required": [
          "date_of_birth",
          "residence_country"
        ],
        "properties": {
          "date_of_birth": {
            "type": "string",
            "format": "date"
          },
          "residence_country": {
            "type": "string",
            "pattern": "^[A-Z]{2}$",
            "description": "ISO 3166-1 country of residence, checked against the supported code list."
          }
        }
      },
      "GuardianInvitation": {
        "type": "object",
        "required": [
          "guardian_name",
          "guardian_email",
          "relationship"
        ],
        "properties": {
          "guardian_name": {
            "type": "string",
            "maxLength": 120
          },
          "guardian_email": {
            "type": "string",
            "format": "email",
            "maxLength": 190
          },
          "relationship": {
            "type": "string",
            "enum": [
              "parent",
              "legal_guardian"
            ]
          }
        }
      },
      "AgeEligibility": {
        "type": "object",
        "required": [
          "owner_id",
          "enforced",
          "allowed",
          "reason",
          "age_band",
          "online_required"
        ],
        "properties": {
          "owner_id": {
            "type": "integer"
          },
          "enforced": {
            "type": "boolean",
            "const": false
          },
          "allowed": {
            "type": "boolean",
            "const": true
          },
          "reason": {
            "type": [
              "string",
              "null"
            ]
          },
          "age_band": {
            "type": "string",
            "const": "unknown"
          },
          "online_required": {
            "type": "boolean"
          },
          "invitations_enabled": {
            "type": "boolean"
          },
          "retired": {
            "type": "boolean",
            "const": true
          }
        },
        "description": "Legacy compatibility response. Does not certify age or replace document consent."
      },
      "AdminArticleDraft": {
        "type": "object",
        "required": [
          "title",
          "slug",
          "category",
          "excerpt",
          "body",
          "read_time_minutes"
        ],
        "properties": {
          "title": {
            "type": "string",
            "maxLength": 255
          },
          "slug": {
            "type": "string",
            "maxLength": 100,
            "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          },
          "category": {
            "type": "string",
            "enum": [
              "anxiety",
              "depression",
              "sleep",
              "relationships",
              "self-care",
              "work"
            ]
          },
          "excerpt": {
            "type": "string",
            "maxLength": 1000
          },
          "body": {
            "type": "string",
            "maxLength": 50000,
            "description": "Plain text, displayed without HTML interpretation."
          },
          "read_time_minutes": {
            "type": "integer",
            "minimum": 1,
            "maximum": 180
          },
          "license": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 255,
            "description": "Required and nonempty before publication."
          },
          "source_url": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 1000,
            "pattern": "^https://"
          }
        }
      },
      "AdminArticleVersion": {
        "type": "object",
        "required": [
          "expected_version"
        ],
        "properties": {
          "expected_version": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        }
      },
      "JournalSharePreview": {
        "type": "object",
        "required": [
          "journal_id",
          "revision",
          "provider",
          "entry",
          "later_edits_shared"
        ],
        "properties": {
          "journal_id": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "provider": {
            "type": "object",
            "required": [
              "id",
              "name"
            ],
            "properties": {
              "id": {
                "type": "integer"
              },
              "name": {
                "type": "string"
              }
            }
          },
          "entry": {
            "type": "object",
            "required": [
              "title",
              "body"
            ],
            "properties": {
              "title": {
                "type": "string"
              },
              "body": {
                "type": "string"
              }
            }
          },
          "later_edits_shared": {
            "const": false
          }
        }
      },
      "JournalShareRequest": {
        "type": "object",
        "required": [
          "journal_id",
          "expected_revision",
          "client_id",
          "confirmed"
        ],
        "properties": {
          "journal_id": {
            "type": "string",
            "format": "uuid"
          },
          "expected_revision": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "client_id": {
            "type": "string",
            "format": "uuid"
          },
          "confirmed": {
            "type": "boolean",
            "const": true
          }
        }
      },
      "JournalSharedCopy": {
        "type": "object",
        "required": [
          "share_id",
          "entry",
          "shared_at",
          "later_edits_shared"
        ],
        "properties": {
          "share_id": {
            "type": "string",
            "format": "uuid"
          },
          "entry": {
            "type": "object",
            "required": [
              "title",
              "body"
            ],
            "properties": {
              "title": {
                "type": "string"
              },
              "body": {
                "type": "string"
              }
            }
          },
          "shared_at": {
            "type": "string",
            "format": "date-time"
          },
          "later_edits_shared": {
            "const": false
          }
        }
      },
      "JournalShareResult": {
        "type": "object",
        "required": [
          "share_id",
          "replayed"
        ],
        "properties": {
          "share_id": {
            "type": "string",
            "format": "uuid"
          },
          "replayed": {
            "type": "boolean"
          }
        }
      }
    }
  },
