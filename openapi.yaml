{
  "openapi": "3.1.0",
  "info": {
    "title": "Cozy Health API",
    "version": "1.0.0",
    "description": "API matching the current Cozy Health Flutter client."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8000"
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Sanctum"
      }
    },
    "schemas": {
      "AgeDeclaration": {
        "type": "object",
        "required": [
          "date_of_birth",
          "residence_country"
        ],
        "properties": {
          "date_of_birth": {
            "type": "string",
            "format": "date"
          },
          "residence_country": {
            "type": "string",
            "pattern": "^[A-Z]{2}$",
            "description": "ISO 3166-1 country of residence, checked against the supported code list."
          }
        }
      },
      "GuardianInvitation": {
        "type": "object",
        "required": [
          "guardian_name",
          "guardian_email",
          "relationship"
        ],
        "properties": {
          "guardian_name": {
            "type": "string",
            "maxLength": 120
          },
          "guardian_email": {
            "type": "string",
            "format": "email",
            "maxLength": 190
          },
          "relationship": {
            "type": "string",
            "enum": [
              "parent",
              "legal_guardian"
            ]
          }
        }
      },
      "AgeEligibility": {
        "type": "object",
        "required": [
          "owner_id",
          "enforced",
          "allowed",
          "reason",
          "age_band",
          "online_required"
        ],
        "properties": {
          "owner_id": {
            "type": "integer"
          },
          "enforced": {
            "type": "boolean"
          },
          "allowed": {
            "type": "boolean"
          },
          "reason": {
            "type": [
              "string",
              "null"
            ]
          },
          "age_band": {
            "type": "string",
            "enum": [
              "unknown",
              "under_13",
              "minor",
              "adult"
            ]
          },
          "online_required": {
            "type": "boolean"
          },
          "patient_consent_ready": {
            "type": "boolean"
          },
          "invitations_enabled": {
            "type": "boolean"
          },
          "residence_country": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      }
    }
  },
