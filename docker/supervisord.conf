[supervisord]
nodaemon = true
user = root
logfile = /proc/self/fd/2
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[program:php-fpm]
command = /usr/local/sbin/php-fpm --nodaemonize
autostart = true
autorestart = true
stopsignal = QUIT
stopwaitsecs = 65
stopasgroup = true
killasgroup = true
stdout_logfile = /proc/self/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /proc/self/fd/2
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autostart = true
autorestart = true
stopsignal = QUIT
stopwaitsecs = 65
stopasgroup = true
killasgroup = true
stdout_logfile = /proc/self/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /proc/self/fd/2
stderr_logfile_maxbytes = 0

[program:queue-worker]
command = /usr/local/bin/php artisan queue:work database --queue=email,%(ENV_DB_QUEUE)s --sleep=3 --tries=1 --timeout=90
directory = /var/www/html
user = www-data
autostart = %(ENV_RUN_QUEUE_WORKER)s
autorestart = true
stopwaitsecs = 100
stopasgroup = true
killasgroup = true
stdout_logfile = /proc/self/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /proc/self/fd/2
stderr_logfile_maxbytes = 0

[program:scheduler]
command = /usr/local/bin/php artisan schedule:work
directory = /var/www/html
user = www-data
autostart = true
autorestart = true
stopwaitsecs = 65
stopasgroup = true
killasgroup = true
stdout_logfile = /proc/self/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /proc/self/fd/2
stderr_logfile_maxbytes = 0
